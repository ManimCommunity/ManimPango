name: Build Wheels

on:
  push:
    branches: [main, v*]
  release:
    types: [created]

jobs:
  build-wheels:
    name: Wheels / ${{ matrix.os }} (${{ matrix.platform_id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform_id: win_amd64
            architecture: x64
          - os: windows-2022
            platform_id: win32
            architecture: x86
          - os: macos-14
            platform_id: macosx_arm64
            architecture: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Copy binary license
        shell: bash
        run: cp packing/LICENSE.bin .

      # On Windows, download Pango binaries once and put pkg-config on PATH
      # before cibuildwheel starts.  GITHUB_PATH / GITHUB_ENV take effect in
      # subsequent steps, so the cibuildwheel step inherits them.
      - name: Download Pango binaries (Windows)
        if: runner.os == 'Windows'
        run: python packing/download_dlls.py

      - name: Add vendor binaries to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\cibw\vendor\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_BUILD: >-
            cp311-${{ matrix.platform_id }}
            cp312-${{ matrix.platform_id }}
            cp313-${{ matrix.platform_id }}
            cp314-${{ matrix.platform_id }}
          CIBW_BEFORE_BUILD_MACOS: "python {project}/packing/download_pango_macos.py ${{ matrix.architecture }}"
          CIBW_ENVIRONMENT_WINDOWS: "PKG_CONFIG_PATH='C:\\cibw\\vendor\\lib\\pkgconfig'"
          CIBW_ENVIRONMENT_MACOS: >-
            PKG_CONFIG_PATH='/Users/runner/pangobuild/lib/pkgconfig'
            MACOSX_DEPLOYMENT_TARGET='11.0'
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: "bash {project}/packing/test_wheels.sh {project}"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.platform_id }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango1.0-dev libcairo2-dev pkg-config

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Test sdist
        run: python -m pip install dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/ManimPango
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect dist files
        run: |
          mkdir -p dist/
          find artifacts/ -name '*.whl' -exec cp {} dist/ \;
          find artifacts/ -name '*.tar.gz' -exec cp {} dist/ \;

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Attach assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
