name: Documentation

on:
  push:
    branches: [main, rewrite-v2]
  pull_request:
    branches: [main, rewrite-v2]

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango1.0-dev libcairo2-dev pkg-config

      - name: Sync the locked development environment
        run: uv sync --locked --group dev

      - name: Install documentation dependencies
        run: uv pip install -r docs/requirements.txt

      - name: Build documentation strictly
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
