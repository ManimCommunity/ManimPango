name: Lint

on:
  push:
    branches: [main, rewrite-v2]
  pull_request:
    branches: [main, v0, rewrite-v2]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --locked --group dev --no-install-project

      - name: Run pre-commit
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure
