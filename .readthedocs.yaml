version: 2
build:
  os: ubuntu-22.04

  tools:
    python: "3.11"

  apt_packages:
    - libpango1.0-dev
    - libcairo2-dev
    - pkg-config

  jobs:
    install:
      - UV_PROJECT_ENVIRONMENT="$READTHEDOCS_VIRTUALENV_PATH" uv sync --locked --only-group docs --no-install-project
      - uv pip install --python "$READTHEDOCS_VIRTUALENV_PATH/bin/python" --no-build-isolation --editable .

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/conf.py

formats: all
